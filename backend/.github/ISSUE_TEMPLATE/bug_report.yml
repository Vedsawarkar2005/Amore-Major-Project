name: Bug report
description: Report a reproducible problem with the project.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the affected app, package, or tooling configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide commands or a minimal reproduction, plus expected and actual results.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Bun version, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and personal information before sharing.


name: Feature request
description: Propose an improvement to the project.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Additional context
      description: Include affected workspaces, examples, or design references.


pre-commit:
  commands:
    biome:
      # Check only staged source files and avoid rewriting partially staged changes.
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}

commit-msg:
  commands:
    commitlint:
      # Lefthook replaces {1} with Git's temporary commit-message file.
      run: bunx commitlint --edit {1}
